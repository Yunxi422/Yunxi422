<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Yunxi422 — Security Researcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050810"/>
      <stop offset="0.55" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="60" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="card" x1="680" y1="64" x2="1136" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1727"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1e293b" stroke-width="1" fill="none"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.25"/>
    <circle cx="110" cy="30" r="150" fill="#22d3ee" opacity="0.13" filter="url(#soft)"/>
    <circle cx="1080" cy="300" r="170" fill="#a78bfa" opacity="0.15" filter="url(#soft)"/>
    <circle cx="620" cy="160" r="120" fill="#f472b6" opacity="0.06" filter="url(#soft)"/>

    <!-- left: identity -->
    <text x="64" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#475569" letter-spacing="2">// PROFILE</text>

    <text x="60" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="66" font-weight="700" fill="url(#accent)" letter-spacing="-1">Yunxi422</text>

    <text x="64" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#94a3b8" letter-spacing="0.6">Security Research · CTF · Kernel &amp; Binary</text>

    <rect x="64" y="212" width="60" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="64" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#64748b">
      <tspan fill="#22d3ee">$</tspan> echo "break it to understand it"
    </text>

    <!-- right: terminal -->
    <rect x="680" y="56" width="456" height="208" rx="14" fill="url(#card)" stroke="#1f2b3d"/>
    <path d="M680 70a14 14 0 0 1 14-14h428a14 14 0 0 1 14 14v14H680z" fill="#0f1a2b"/>
    <circle cx="702" cy="70" r="5" fill="#f87171"/>
    <circle cx="720" cy="70" r="5" fill="#fbbf24"/>
    <circle cx="738" cy="70" r="5" fill="#34d399"/>
    <text x="1116" y="75" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#3f4f66">bash — 80×24</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#cbd5e1">
      <text x="704" y="118"><tspan fill="#22d3ee">➜</tspan> <tspan fill="#7dd3fc">~</tspan> whoami</text>
      <text x="704" y="142" fill="#94a3b8">yunxi · Guilin, CN</text>
      <text x="704" y="172"><tspan fill="#22d3ee">➜</tspan> <tspan fill="#7dd3fc">~</tspan> ls ./focus</text>
      <text x="704" y="196" fill="#a78bfa">pwn/  re/  crypto/  web/  forensics/</text>
      <text x="704" y="226"><tspan fill="#22d3ee">➜</tspan> <tspan fill="#7dd3fc">~</tspan> <tspan fill="#f472b6">_</tspan></text>
    </g>
  </g>
</svg>
